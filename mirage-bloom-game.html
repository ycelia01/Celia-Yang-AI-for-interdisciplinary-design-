<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mirage Bloom</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&family=Noto+Sans+SC:wght@400;500&display=swap" rel="stylesheet">
<style>
/* Layout idea: one 16:9 stage. A canvas paints the desert; a thin HTML layer on top holds the HUD, cards and dialogs. */
:root{
  --ink:#1d2040; --paper:#fffaf4; --soft:#f0e6f0; --hud:#fff6ec; --accent:#c4452f;
  --geo:#4f6fb0; --bio:#3f8a6b; --anth:#c4452f; --muted:#5b5f80;
  --display:"Instrument Serif","Noto Sans SC",Georgia,serif;
  --body:"IBM Plex Sans","Noto Sans SC",system-ui,sans-serif;
  --mono:"IBM Plex Mono","Noto Sans SC",ui-monospace,monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0;background:#12152a;color:var(--hud);font-family:var(--body);overflow:hidden}
#wrap{position:fixed;inset:0;display:grid;place-items:center}
#stage{position:relative;width:min(100vw,calc(100vh*16/9));aspect-ratio:16/9;overflow:hidden;background:#2a2556;font-size:10px;user-select:none;-webkit-user-select:none;touch-action:manipulation}
#scene{position:absolute;inset:0;width:100%;height:100%;display:block;outline:none}
#scene:focus-visible{box-shadow:inset 0 0 0 3px #ffd9a8}
#hud{position:absolute;inset:0;pointer-events:none;transition:opacity .8s}
#hud.idle{opacity:.55}
#hud > *{position:absolute}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible{outline:2px solid #ffd9a8;outline-offset:2px}
.pill{pointer-events:auto;font:500 .85em var(--mono);color:var(--hud);background:rgba(24,24,58,.42);border:1.5px solid rgba(255,246,236,.78);border-radius:999px;padding:.4em 1em;backdrop-filter:blur(3px);letter-spacing:.04em}
.pill:hover{background:rgba(24,24,58,.62)}
.pill[aria-pressed="true"]{background:rgba(255,246,236,.92);color:var(--ink)}
.txt{text-shadow:0 1px 6px rgba(20,20,60,.55)}
#tl{left:2.4em;top:1.7em}
#kept{font:500 1.35em var(--mono);letter-spacing:.04em}
#stg{font:400 .85em var(--mono);letter-spacing:.1em;opacity:.9;margin-top:.15em}
#hint{left:50%;top:1.5em;transform:translateX(-50%);width:46em;text-align:center;font:italic 400 2.1em/1.15 var(--display);transition:opacity 1s}
#hint.faded{opacity:0}
#tr{right:2.4em;top:1.5em;display:flex;gap:.6em;align-items:center}
#langs{display:flex;gap:.25em}
#langs .pill{padding:.4em .7em}
#layers{right:2.4em;top:6.2em;width:17em;pointer-events:auto;background:rgba(255,250,244,.93);color:var(--ink);border-radius:1em;padding:.9em 1em;box-shadow:0 8px 24px rgba(20,20,60,.25)}
#layers h4{margin:0 0 .5em;font:400 1.3em var(--display)}
.lrow{display:grid;grid-template-columns:5.2em 1fr 2.6em;align-items:center;gap:.5em;padding:.28em 0;font:500 .8em var(--mono);cursor:pointer;background:none;border:0;width:100%;color:var(--ink);text-align:left}
.lrow .wf{height:1.5em}
.lrow.off{opacity:.4}
.lrow.later{opacity:.5;cursor:default}
.lrow .c{text-align:right;color:var(--muted)}
#dots{left:2.4em;bottom:1.7em;display:flex;gap:.9em;align-items:center}
#dots i{display:block;width:1.05em;height:1.05em;border-radius:50%;border:2px solid rgba(255,246,236,.9)}
#dots i.done{background:rgba(255,246,236,.95)}
#dots i.cur{background:rgba(255,246,236,.95);transform:scale(1.35)}
#dots i.next{border-style:dashed;opacity:.8}
#land{right:2.4em;bottom:1.7em;font:500 .85em var(--mono);padding:.55em 1em;background:rgba(255,250,244,.92);color:var(--ink);border-radius:.6em;letter-spacing:.03em;transition:transform .4s}
#land small{display:block;font-weight:400;color:var(--muted);font-size:.8em}
#land.pulse{transform:scale(1.12)}
#cards{left:50%;bottom:6.4em;transform:translateX(-50%);width:30em;display:grid;gap:.5em;justify-items:stretch}
.card{pointer-events:auto;background:var(--paper);color:var(--ink);border-left:.5em solid var(--c,var(--muted));border-radius:.9em;padding:.8em 1.1em;box-shadow:0 10px 28px rgba(20,20,60,.32);animation:rise .4s ease both;font-size:.9em}
.card .chip{display:flex;align-items:center;gap:.6em;font:500 .8em var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--c)}
.card .chip .x{margin-left:auto;font-size:1.2em;background:none;border:0;color:var(--muted);padding:0 .2em;line-height:1}
.card h4{margin:.15em 0 .1em;font:400 1.7em/1.1 var(--display)}
.card p{margin:.2em 0;line-height:1.4}
.card .grew{color:var(--muted);font-size:.92em}
.card.small{padding:.55em 1.1em}
.card.small h4{font-size:1.3em;margin:0}
.card.mir{border-left-style:dashed}
@keyframes rise{from{opacity:0;transform:translateY(1em)}to{opacity:1;transform:none}}
.reduce .card{animation:fade .4s ease both}
@keyframes fade{from{opacity:0}to{opacity:1}}
#acts{left:50%;bottom:1.8em;transform:translateX(-50%);display:flex;gap:.8em}
#acts .pill,#echoacts .pill,#nextpill{font-size:.95em;padding:.5em 1.3em}
#acts[hidden],#echoacts[hidden],#nextpill[hidden],#cards:empty{display:none}
#echoacts{left:50%;bottom:1.8em;transform:translateX(-50%);display:flex;gap:.8em}
#nextpill{left:50%;bottom:1.8em;transform:translateX(-50%)}
.hide-pre,.hide-play{}
body[data-stage="0"] .hide-pre{display:none!important}
body[data-stage="6"] #hud > *:not(#tr):not(#land){display:none}
/* prelude */
#prelude{position:absolute;inset:0;pointer-events:none}
#prelude > *{position:absolute;pointer-events:auto}
#ptitle{left:4%;top:3.5%;font:500 1.7em var(--mono);letter-spacing:.34em;text-shadow:0 1px 8px rgba(20,20,60,.5)}
#ptag{left:4%;top:12.5%;font:500 1.2em var(--mono);letter-spacing:.14em;opacity:1;text-shadow:0 1px 8px rgba(20,20,60,.55)}
#pcond{left:30%;top:3.5%;width:42%;font:italic 400 1.6em/1.2 var(--display);text-shadow:0 1px 8px rgba(20,20,60,.55)}
#pbegin{right:7%;top:56%;font-size:1.25em;padding:.55em 1.5em}
#psnd{right:7%;top:66%}
#pnote{left:4%;top:18%;font:400 .85em/1.45 var(--mono);opacity:.95;text-align:left;width:25em;text-shadow:0 1px 6px rgba(20,20,60,.6)}
body:not([data-stage="0"]) #prelude{display:none}
/* modal */
#modal{position:absolute;inset:0;display:grid;place-items:center;background:rgba(18,20,48,.35);z-index:5}
#modal[hidden],#settings[hidden],#paused[hidden]{display:none}
.mbox{background:var(--paper);color:var(--ink);border-radius:1.2em;padding:1.6em 1.8em;width:44em;max-width:94%;max-height:92%;overflow:auto;box-shadow:0 20px 60px rgba(10,10,40,.5);font-size:1em}
.mbox h3{margin:0 0 .2em;font:400 2.4em/1.05 var(--display)}
.mbox p{margin:.4em 0;line-height:1.5;font-size:.95em}
.mbox .row{display:flex;gap:.7em;flex-wrap:wrap;margin-top:1em;align-items:center}
.btn{font:500 .9em var(--mono);border-radius:999px;padding:.55em 1.3em;border:1.5px solid var(--ink);background:transparent;color:var(--ink)}
.btn.primary{background:var(--ink);color:var(--paper)}
.btn:hover{opacity:.85}
a.btn{text-decoration:none;display:inline-block}
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:.7em;margin-top:.8em}
.tile{border:1px solid #d8d6e6;border-top:.35em solid var(--c);border-radius:.7em;padding:.6em .8em;font-size:.88em}
.tile b{font:500 .85em var(--mono);color:var(--c);letter-spacing:.06em;text-transform:uppercase;display:block}
.tile span{display:block;color:var(--muted);line-height:1.35;margin:.2em 0}
.tile .num{font:400 2em var(--display);color:var(--ink)}
.seq{display:flex;flex-wrap:wrap;gap:.35em;margin:.6em 0}
.seq i{font-style:normal;font:500 .75em var(--mono);padding:.25em .6em;border-radius:999px;border:1.5px solid var(--c,#999);color:var(--c,#999)}
.seq i.rest{border-style:dashed;color:#999;--c:#999}
.seq i.on{background:var(--c);color:#fff}
.kv{display:flex;gap:1.2em;flex-wrap:wrap;font:400 .85em var(--mono);color:var(--muted);margin:.4em 0}
.kv b{color:var(--ink);font-weight:500}
#pcprev{width:100%;border-radius:.6em;border:1px solid #d8d6e6;margin-top:.6em;display:block}
.mbox input[type=email]{font:400 .95em var(--body);padding:.5em .9em;border-radius:.6em;border:1.5px solid #b9b6d0;min-width:16em;flex:1;color:var(--ink);background:#fff}
.note{font-size:.82em!important;color:var(--muted)}
/* settings */
#settings{position:absolute;right:2.4em;top:5em;width:22em;background:var(--paper);color:var(--ink);border-radius:1em;padding:1em 1.2em;box-shadow:0 14px 40px rgba(10,10,40,.45);z-index:6;font-size:.95em}
#settings h4{margin:0 0 .5em;font:400 1.5em var(--display)}
#settings label{display:flex;gap:.6em;align-items:center;padding:.35em 0;font-size:.9em}
#settings .btn{margin:.25em .25em 0 0;font-size:.8em;padding:.4em 1em}
#paused{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);font:italic 400 3em var(--display);text-shadow:0 2px 12px rgba(20,20,60,.6);pointer-events:none}
.sr{position:absolute;left:-9999px;width:1px;height:1px;overflow:hidden}
#rot{display:none;position:fixed;left:0;right:0;bottom:0;text-align:center;font:400 12px var(--mono);padding:6px;background:rgba(18,20,48,.9);z-index:9}
@media (max-aspect-ratio:1/1){#rot{display:block}}
@media (prefers-reduced-motion:reduce){.card{animation:fade .4s ease both}}
</style>
</head>

</div>
</div>
<div id="rot">Best in landscape. Turn your phone sideways.</div>
<div id="sr" class="sr" aria-live="polite"></div>

 else if(type==='real'){el.classList.add('small');el.style.setProperty('--c','#4f6fb0');html=`<div class="chip"><span>${esc(tr('realLabel'))}</span></div><h4>${esc(tr('realTitle'))}</h4><p>${esc(tr('realDef'))}</p>`;ann=tr('realTitle')}
 else{el.classList.add('small');el.style.setProperty('--c','#6b6f94');html=`<h4>${esc(o.t)}</h4>`;ann=o.t;ttl=5000}
 el.innerHTML=html;box.appendChild(el);const x=el.querySelector('.x');if(x)x.addEventListener('click',()=>{box.innerHTML=''});
 say(ann);S.cardTimer=setTimeout(()=>{if(box.firstChild===el)box.innerHTML=''},ttl);
}

/* ---------- modal ---------- */
function openModal(html){S.modal=true;$('#mbox').innerHTML=html;$('#modal').hidden=false;updateUI();const f=$('#mbox').querySelector('button,input');if(f)f.focus()}
function closeModal(){S.modal=false;$('#modal').hidden=true;$('#mbox').innerHTML='';if(S.play){S.play.forEach(clearTimeout);S.play=null}updateUI();cv.focus({preventScroll:true})}
function countTiles(){
 return `<div class="tiles">`+['geo','bio','anth'].map(c=>`<div class="tile" style="--c:${CLS[c].col}"><b>${esc(tx(CLS[c].n))}</b><div class="num">${S.stage>=5||S.stage===6?S.run[c]:(c==='anth'?S.run.anth:S.stageKept[c])}</div><span>${esc(tx(CLS[c].def))}</span></div>`).join('')+`</div>`;
}
function openComplete(){
 if(S.stage<1||S.stage>4||S.modal)return;
 openModal(`<h3>${esc(tr('complete'))}</h3><p class="kv"><span>${esc(stageLabel())}</span></p>${countTiles()}
  <div class="kv"><span>${esc(tr('dissolved'))}: <b>${S.stageDissolved}</b></span><span>${esc(tr('rightcalls'))}: <b>${S.run.rightCalls}</b></span></div>
  <div class="row"><button class="btn primary" id="mCont">${esc(tr('cont'))}</button><button class="btn" id="mStay">${esc(tr('stay'))}</button></div>`);
 $('#mCont').onclick=()=>{closeModal();nextStage()};$('#mStay').onclick=()=>{closeModal()};
}

/* ---------- stage flow ---------- */
function startStage(n){
 S.stage=n;S.stageT=S.at;S.stageReal=0;S.stageRight=0;S.stageKept={geo:0,bio:0,anth:0};S.stageDissolved=0;S.goalMet=false;S.spawnCount=0;S.lastMirage=false;S.floodShown=false;
 for(const b of S.bubbles){if(b.state==='live'){b.state='fade';b.state0=S.at;stopListen(b)}}
 S.kfocus=S.tfocus=null;S.lastSpawn=S.t-(ST[n].gap-2.5);
 setPal(n);if(n===2)S.sagMoveT=S.at;
 $('#hint').classList.remove('faded');updateUI();say(stageLabel()+'. '+tx(STG[n].hint));
}
function nextStage(){if(S.stage>=1&&S.stage<5)startStage(S.stage+1)}
function beginGame(){
 if(S.stage!==0)return;C.drainFlood();S.run=newRun();S.seen={geo:0,bio:0,anth:0};S.layers={geo:[],bio:[],anth:[]};S.ghosts=[];S.sagMoveT=-1;
 startStage(1);
}
function checkGoal(){
 if(S.goalMet||S.stage<1||S.stage>4)return;
 let ok=false;
 if(S.stage<=2)ok=S.stageReal>=ST[S.stage].goal;
 else if(S.stage===3)ok=S.stageReal>=9&&S.stageKept.geo>=3&&S.stageKept.bio>=3;
 else ok=S.stageRight>=10;
 if(ok){S.goalMet=true;updateUI();setTimeout(()=>{if(S.goalMet&&!S.modal)openComplete()},1300)}
}
function resetRun(){
 for(const b of S.bubbles)if(b.loop)stopLoop(b.loop);
 S.bubbles=[];S.parts=[];S.run=newRun();S.seen={geo:0,bio:0,anth:0};S.layers={geo:[],bio:[],anth:[]};S.mute={geo:0,bio:0,anth:0};S.ghosts=[];S.sagMoveT=-1;S.postcard=null;
 S.stage=0;S.stageReal=0;S.stageRight=0;S.stageKept={geo:0,bio:0,anth:0};S.goalMet=false;S.flood=1;S.kfocus=S.tfocus=null;
 C.rebuildLayers();setPal(1);if(S.sound)C.startFlood();updateUI();
}
const stopLoop=C.stopLoop;

/* ---------- bubbles ---------- */
function chooseClass(){
 const st=ST[S.stage];
 if(S.stage===3){const a=S.stageKept.geo,b=S.stageKept.bio;if(a<3&&b>=3)return 'geo';if(b<3&&a>=3)return 'bio';return Math.random()<.5?'geo':'bio'}
 return pick(st.cls);
}
function spawn(){
 const st=ST[S.stage];const live=S.bubbles.filter(b=>b.state==='live');
 let mirage;const anyReal=live.some(b=>b.real);
 if(S.spawnCount===0)mirage=false;
 else if(!anyReal&&live.length)mirage=false;
 else{mirage=Math.random()<1/st.mir;if(S.stage===1&&!S.floodShown&&S.spawnCount===2)mirage=true;if(mirage&&S.stage<=2&&S.lastMirage)mirage=false}
 const cls=chooseClass();let kind;
 if(mirage&&S.stage===1&&!S.floodShown){kind='flood';S.floodShown=true}
 else{const opts=CLS_KINDS[cls].filter(k=>!live.some(b=>b.kind===k));kind=pick(opts.length?opts:CLS_KINDS[cls])}
 let best=null,bd=-1;
 for(let i=0;i<14;i++){const x=rnd(ZX0,ZX1),y=rnd(ZY0,ZY1);let md=1e9;for(const b of live)md=Math.min(md,Math.hypot(b.x-x,b.y0-y));if(md>bd){bd=md;best={x,y}}}
 S.bubbles.push({id:S.nid++,kind,cls:KINDS[kind].cls,real:!mirage,x:best.x,y:best.y,y0:best.y,gy:Math.round(rnd(650,760)),born:S.t,life:st.life,r:40,ph:Math.random()*6,dir:Math.random()<.5?1:-1,sx:rnd(500,1100),state:'live',state0:0,alpha:0,listening:false,hoverT:0,loop:null});
 S.spawnCount++;S.lastMirage=mirage;S.lastSpawn=S.t;
}
function startListen(b){b.listening=true;if(S.sound)b.loop=C.startLoop(b.kind,b.real,.55);say(`${tx(KINDS[b.kind].n)}, ${tr('keep')}?`)}
function stopListen(b){b.listening=false;if(b.loop){stopLoop(b.loop);b.loop=null}}
function burst(x,y,col,n){for(let i=0;i<n;i++){const a=Math.random()*6.28,s=rnd(30,120);S.parts.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s-20,life:0,max:rnd(.5,1.1),col,r:rnd(1.5,4)})}}
function progText(){return S.stage===4?`${S.stageRight} ${tr('firstOf')} ${ST[4].goal}`:S.stage===5?String(S.stageReal):`${S.stageReal} ${tr('firstOf')} ${ST[S.stage].goal}`}
function keepBubble(b){
 if(!b||b.state!=='live'||S.modal)return;
 stopListen(b);if(S.kfocus===b)S.kfocus=null;if(S.tfocus===b)S.tfocus=null;b.state0=S.at;
 const cls=b.cls;
 if(b.real){
  b.state='kept';b.fx=b.x;b.fy=b.y;
  S.run[cls]++;S.stageKept[cls]++;S.stageReal++;S.run.journal.push({kind:b.kind,cls,real:true,stage:S.stage});
  if(S.stage===4){S.stageRight++;S.run.flowers++}
  const arr=S.layers[cls];arr.push(b.kind);if(arr.length>3)arr.shift();C.rebuildLayers();C.chimeSound();
  burst(b.x,b.y,'#ffe3a8',14);showCard('keep',{cls,kind:b.kind,prog:progText()});
 }else{
  b.state='dissolve';S.run.mirKept++;S.stageDissolved++;S.run.journal.push({kind:b.kind,cls,real:false,stage:S.stage});
  S.ghosts.push({t:S.at,f:.2+Math.random()*.6,s:Math.random()<.5?-1:1});C.shimmerSound();burst(b.x,b.y,'#ffb4d2',18);showCard('mirage',{});
 }
 updateUI();checkGoal();
}
function dismissBubble(b){
 if(!b||b.state!=='live'||S.modal)return;
 stopListen(b);if(S.kfocus===b)S.kfocus=null;if(S.tfocus===b)S.tfocus=null;b.state0=S.at;
 if(b.real){b.state='sink';showCard('real',{})}
 else{b.state='dissolve';S.run.rightCalls++;S.run.glints++;if(S.stage===4){S.stageRight++;S.run.flowers++}C.shimmerSound();burst(b.x,b.y,'#ffb4d2',18);showCard('right',{})}
 updateUI();checkGoal();
}
function liveBubbles(){return S.bubbles.filter(b=>b.state==='live'&&b.alpha>.3).sort((a,b)=>a.x-b.x)}
function cycleFocus(dir){
 const l=liveBubbles();if(!l.length)return false;
 let i=l.indexOf(S.kfocus);i=i<0?(dir>0?0:l.length-1):(i+dir+l.length)%l.length;
 S.kfocus=l[i];S.tfocus=null;S.hover=null;updateUI();return true;
}
function hit(e){
 const r=cv.getBoundingClientRect(),x=(e.clientX-r.left)/r.width*W,y=(e.clientY-r.top)/r.height*H;
 const l=liveBubbles().reverse();for(const b of l){if(Math.hypot(b.x-x,b.y-y)<=b.r+12)return b}return null;
}

/* ---------- input ---------- */
let press=null;
cv.addEventListener('pointermove',e=>{S.idle=0;if(e.pointerType==='touch')return;S.hover=hit(e)});
cv.addEventListener('pointerleave',()=>{S.hover=null});
cv.addEventListener('pointerdown',e=>{
 S.idle=0;cv.focus({preventScroll:true});const b=hit(e);
 if(e.pointerType==='touch'||e.pointerType==='pen'){
  press={b,long:false,timer:b?setTimeout(()=>{if(press&&press.b){press.long=true;dismissBubble(press.b)}},500):0};
 }else if(e.button===0&&b)keepBubble(b);
});
cv.addEventListener('pointerup',e=>{
 if(!press)return;clearTimeout(press.timer);const p=press;press=null;
 if(p.long)return;
 if(p.b){if(S.tfocus===p.b)keepBubble(p.b);else{S.tfocus=p.b;S.kfocus=null;updateUI()}}else{S.tfocus=null;updateUI()}
});
cv.addEventListener('pointercancel',()=>{if(press){clearTimeout(press.timer);press=null}});
cv.addEventListener('contextmenu',e=>{e.preventDefault();const b=hit(e);if(b)dismissBubble(b)});
cv.addEventListener('keydown',e=>{
 S.idle=0;
 if(e.key==='Tab'){if(cycleFocus(e.shiftKey?-1:1))e.preventDefault();return}
 if(e.key==='ArrowRight'||e.key==='ArrowDown'){if(cycleFocus(1))e.preventDefault();return}
 if(e.key==='ArrowLeft'||e.key==='ArrowUp'){if(cycleFocus(-1))e.preventDefault();return}
 if(e.key==='Enter'||e.key===' '){const b=S.kfocus||S.hover;if(b){e.preventDefault();keepBubble(b)}return}
 if(e.key==='x'||e.key==='X'){const b=S.kfocus||S.hover;if(b)dismissBubble(b)}
});
window.addEventListener('keydown',e=>{
 if(e.target&&e.target.tagName==='INPUT')return;
 if(e.key==='m'||e.key==='M'){toggleSound()}
 else if(e.key==='p'||e.key==='P'){togglePause()}
 else if(e.key==='Escape'){if(S.modal&&S.stage!==6)closeModal();else toggleSettings()}
});
window.addEventListener('pointermove',()=>{S.idle=0},{passive:true});
$('#btnKeep').onclick=()=>keepBubble(S.kfocus||S.tfocus);
$('#btnDismiss').onclick=()=>dismissBubble(S.kfocus||S.tfocus);
$('#pbegin').onclick=()=>{beginGame();cv.focus({preventScroll:true})};
$('#nextpill').onclick=()=>nextStage();
function toggleSound(){C.setSound(!S.sound);updateUI()}
$('#btnSound').onclick=toggleSound;$('#psnd').onclick=toggleSound;
document.querySelectorAll('#langs .pill').forEach(b=>b.onclick=()=>{S.lang=b.dataset.l;updateUI();if(!$('#settings').hidden)buildSettings();if(S.stage===6&&S.modal)renderEnd(S.endShifted)});
function togglePause(){if(S.stage<1||S.stage>5)return;S.paused=!S.paused;$('#paused').hidden=!S.paused;$('#paused').textContent=tr('paused');$('#hint').classList.remove('faded')}
function toggleSettings(){const s=$('#settings');s.hidden=!s.hidden;if(!s.hidden)buildSettings()}
$('#btnGear').onclick=toggleSettings;
function buildSettings(){
 const s=$('#settings');
 s.innerHTML=`<h4>${esc(tr('settings'))}</h4>
  <label><input type="checkbox" id="stAssist" ${S.assist?'checked':''}> ${esc(tr('assist'))}</label>
  <label><input type="checkbox" id="stMotion" ${S.reduce?'checked':''}> ${esc(tr('motion'))}</label>
  <div><button class="btn" id="stPrev">${esc(tr('previewShift'))}</button><button class="btn" id="stReset">${esc(tr('resetLand'))}</button><button class="btn" id="stRestart">${esc(tr('restart'))}</button><button class="btn" id="stClose">${esc(tr('close'))}</button></div>`;
 $('#stAssist').onchange=e=>{S.assist=e.target.checked};
 $('#stMotion').onchange=e=>{S.reduce=e.target.checked;stageEl.classList.toggle('reduce',S.reduce)};
 $('#stPrev').onclick=()=>{S.land.count=499;saveLand();updateUI();showCard('info',{t:`${landText()}. ${S.lang==='zh'?'完成一次游戏并种下，即可看到地面移动。':S.lang==='es'?'Termina una partida y planta para ver moverse el suelo.':'Finish a run and plant to see the ground move.'}`})};
 $('#stReset').onclick=()=>{S.land.count=0;S.land.epoch=1;S.land.far=0;saveLand();updateUI()};
 $('#stRestart').onclick=()=>{$('#settings').hidden=true;closeModal();resetRun()};
 $('#stClose').onclick=()=>{$('#settings').hidden=true};
}
stageEl.classList.toggle('reduce',S.reduce);

/* ---------- Echo: journal, playback, plant ---------- */
function openJournal(auto){
 const items=S.run.journal.filter(j=>j.stage===5||true);
 const seq=items.map((j,i)=>j.real?`<i data-i="${i}" style="--c:${CLS[j.cls].col}">${esc(tx(KINDS[j.kind].n))}</i>`:`<i class="rest" data-i="${i}">—</i>`).join('');
 openModal(`<h3>${esc(tr('journal'))}</h3>${countTiles()}<p class="note">${esc(tr('glossary'))}: ${['geo','bio','anth'].map(c=>`<b style="color:${CLS[c].col}">${esc(tx(CLS[c].n))}</b>`).join(' · ')}</p>
  <div class="seq" id="seq">${seq}</div><div class="kv"><span>${esc(tr('rests'))}: <b>${S.run.mirKept}</b></span></div><p class="note" id="plmsg"></p>
  <div class="row"><button class="btn primary" id="jPlay">${esc(tr('playback'))}</button><button class="btn primary" id="jPlant">${esc(tr('plant'))}</button><button class="btn" id="jClose">${esc(tr('close'))}</button></div>`);
 $('#jClose').onclick=closeModal;$('#jPlant').onclick=plant;$('#jPlay').onclick=()=>playback(items);
 if(auto)playback(items);
}
function playback(items){
 if(S.play)S.play.forEach(clearTimeout);S.play=[];let t=300;
 const els=[...document.querySelectorAll('#seq i')];els.forEach(e=>e.classList.remove('on'));
 items.forEach((j,i)=>{
  S.play.push(setTimeout(()=>{els.forEach(e=>e.classList.remove('on'));if(els[i])els[i].classList.add('on');
   if(j.real&&S.sound&&A.ctx){const bus=C.mkBus(true,.7);try{VOICE[j.kind](bus,true,A.ctx.currentTime+.03)}catch(e){}}},t));
  t+=j.real?1500:900;
 });
 S.play.push(setTimeout(()=>{els.forEach(e=>e.classList.remove('on'));const m=$('#plmsg');if(m)m.textContent=tr('playOver')},t+200));
}
function plant(){
 if(S.run.planted)return;S.run.planted=true;if(S.modal)closeModal();
 S.land.count++;S.postIdx=S.land.count;S.postEpoch=S.land.epoch;saveLand();C.chimeSound();
 const ld=$('#land');ld.classList.add('pulse');setTimeout(()=>ld.classList.remove('pulse'),500);updateUI();
 setTimeout(()=>{
  makePostcard();
  if(S.land.count>=S.land.max){startShift()}else{renderEnd(false)}
 },220);
}
$('#btnPlayback').onclick=()=>openJournal(true);
$('#btnPlant').onclick=plant;

/* ---------- ground shift ---------- */
function startShift(){S.shift={t0:S.at,dur:9};C.oneShotRumble();$('#hint').classList.add('faded');setTimeout(finishShift,9200)}
function finishShift(){
 S.land.far=Math.min(1500,S.land.far+500);S.land.epoch++;S.land.count=0;saveLand();S.shift=null;S.ghosts=[];S.endShifted=true;
 for(const k of ['geo','bio','anth'])ART_reset();renderEnd(true);
}

/* ---------- end card ---------- */
function renderEnd(shifted){
 S.endShifted=shifted;
 if(S.stage!==6){S.stage=6;setPal(6);for(const b of S.bubbles){if(b.loop)stopLoop(b.loop)}S.bubbles=[]}

 const pc=S.postcard;
 openModal(`<h3>${esc(shifted?tr('newLand'):tr('joined'))}</h3><p>${esc(tr('nextMorning'))}</p>
  <div class="kv"><span>${esc(tr('pcNo'))} <b>${S.postIdx||0}</b> ${esc(tr('pcIn'))} <b>${S.postEpoch||S.land.epoch}</b></span><span>${esc(landText())}</span></div>
  <p class="note" style="margin-top:.8em"><b>${esc(tr('pcTitle'))}</b></p>
  ${pc?`<img id="pcprev" src="${pc.url}" alt="${esc(tr('pcTitle'))}">`:''}
  <div class="row"><input type="email" id="pcAddr" placeholder="${esc(tr('pcAddr'))}" autocomplete="email" aria-label="${esc(tr('pcAddr'))}"><button class="btn" id="pcMail">${esc(tr('pcEmail'))}</button></div>
  <div class="row" style="margin-top:.5em"><button class="btn primary" id="pcDl">${esc(tr('pcDownload'))}</button><button class="btn" id="pcCopy">${esc(tr('pcCopy'))}</button></div>

 $('#pcDl').onclick=downloadPostcard;$('#pcMail').onclick=mailPostcard;$('#pcCopy').onclick=copyMsg;

function postMessage(){
 const r=S.run;
 return `${tr('pcMsg')}\n\n${tr('pcNo')} ${S.postIdx||0} ${tr('pcIn')} ${S.postEpoch||S.land.epoch}.\n${tx(CLS.geo.n)}: ${r.geo}  ·  ${tx(CLS.bio.n)}: ${r.bio}  ·  ${tx(CLS.anth.n)}: ${r.anth}\n${tr('dissolved')}: ${r.mirKept}  ·  ${tr('rightcalls')}: ${r.rightCalls}\n\n(${tr('pcNote')})`;

async function downloadPostcard(){
 if(!S.postcard)return;const m=$('#pcmsg');
 const name='mirage-bloom-sound-postcard.png';
 let dl=null;try{dl=window.claude&&window.claude.use?await window.claude.use('downloads'):null}catch(e){dl=null}
 if(dl){
  try{const blob=await (await fetch(S.postcard.url)).blob();await dl.save({filename:name,data:blob});m.textContent=tr('pcSaved');return}
  catch(e){if(e&&e.code==='declined'){return}}
 }
 try{const a=document.createElement('a');a.href=S.postcard.url;a.download=name;document.body.appendChild(a);a.click();a.remove()}catch(e){}
 m.textContent=S.lang==='zh'?'\u5df2\u5f00\u59cb\u4e0b\u8f7d\u3002\u82e5\u6ca1\u6709\u53cd\u5e94\uff0c\u8bf7\u957f\u6309\u6216\u53f3\u952e\u70b9\u51fb\u660e\u4fe1\u7247\u4fdd\u5b58\u3002':S.lang==='es'?'Descarga iniciada. Si no pasa nada, mant\u00e9n pulsada o haz clic derecho en la postal para guardarla.':'Download started. If nothing happens, press and hold or right-click the postcard to save it.';

function mailPostcard(){

function makePostcard(){
 const PW=1800,PH=1100,pc=document.createElement('canvas');pc.width=PW;pc.height=PH;const p=pc.getContext('2d');
 const INK='#1d2040',PAPER='#fbf4ec';
 p.fillStyle=PAPER;p.fillRect(0,0,PW,PH);
 p.strokeStyle='#d8cfc4';p.lineWidth=2;p.strokeRect(14,14,PW-28,PH-28);
 const px=48,py=48,pw=1100,ph=Math.round(1100*9/16);
 p.drawImage(cv,0,0,cv.width,cv.height,px,py,pw,ph);p.lineWidth=6;p.strokeStyle=INK;p.strokeRect(px,py,pw,ph);
 const disp='"Instrument Serif","Noto Sans SC",Georgia,serif',mono='"IBM Plex Mono","Noto Sans SC",monospace',body='"IBM Plex Sans","Noto Sans SC",sans-serif';
 p.fillStyle=INK;p.font=`400 118px ${disp}`;p.textBaseline='alphabetic';p.fillText('Mirage Bloom',px,py+ph+130);
 p.font=`italic 400 44px ${disp}`;p.fillStyle='#5b5f80';p.fillText(tr('tagline'),px,py+ph+196);
 p.font=`400 26px ${mono}`;p.fillText(new Date().toLocaleDateString(S.lang==='zh'?'zh-CN':S.lang==='es'?'es':'en',{year:'numeric',month:'long',day:'numeric'}),px,py+ph+254);
 p.font=`400 26px ${mono}`;p.fillText(tr('pcMsg'),px,py+ph+300);
 // right panel
 const rx=1210;p.strokeStyle='#cfc6ba';p.lineWidth=2;p.beginPath();p.moveTo(rx-26,48);p.lineTo(rx-26,PH-48);p.stroke();
 p.fillStyle='#8a8fb0';p.font=`500 24px ${mono}`;p.fillText(tr('pcTitle').toUpperCase(),rx,84);
 // stamp
 const sx=PW-48-150,sy=48;p.save();p.setLineDash([8,6]);p.strokeStyle=INK;p.lineWidth=3;p.strokeRect(sx,sy,150,170);p.restore();
 try{const spr=C.playerSprite();const k=Math.min(120/spr.c.width,140/spr.c.height)*1.4;p.drawImage(spr.c,sx+75-spr.c.width*k/2,sy+160-spr.by*k-4,spr.c.width*k,spr.c.height*k)}catch(e){}
 p.fillStyle=INK;p.font=`400 56px ${disp}`;p.fillText(`${tr('pcNo')} ${S.postIdx||0}`,rx,150);
 p.font=`italic 400 40px ${disp}`;p.fillStyle='#5b5f80';p.fillText(`${tr('pcIn')} ${S.postEpoch||S.land.epoch}`,rx,200);
 // counts
 let y=278;const r=S.run;
 for(const [c,n] of [['geo',r.geo],['bio',r.bio],['anth',r.anth]]){p.fillStyle=CLS[c].col;p.beginPath();p.arc(rx+14,y-9,12,0,7);p.fill();p.fillStyle=INK;p.font=`500 32px ${body}`;p.fillText(tx(CLS[c].n),rx+40,y);p.font=`400 44px ${disp}`;p.textAlign='right';p.fillText(String(n),rx+330,y+4);p.textAlign='left';y+=58}
 p.fillStyle='#5b5f80';p.font=`400 26px ${mono}`;p.fillText(`${tr('dissolved')}: ${r.mirKept}   ${tr('rightcalls')}: ${r.rightCalls}`,rx,y+6);
 // sound strip
 y+=62;p.fillStyle='#8a8fb0';p.font=`500 22px ${mono}`;p.fillText(tr('soundStrip').toUpperCase(),rx,y);y+=18;
 const jr=r.journal.slice(0,60);let cx=rx,cy=y;
 for(const j of jr){if(cx>rx+520){cx=rx;cy+=26}
  if(j.real){p.fillStyle=CLS[j.cls].col;p.fillRect(cx,cy,12,20)}else{p.strokeStyle='#9a9ab0';p.setLineDash([3,3]);p.lineWidth=2;p.strokeRect(cx+1,cy+1,10,18);p.setLineDash([])}
  cx+=17}
 y=cy+58;
 // land map
 p.fillStyle='#8a8fb0';p.font=`500 22px ${mono}`;p.fillText(tr('landMap').toUpperCase(),rx,y);y+=16;
 const mw=540,mh=Math.min(300,PH-48-y-130);p.fillStyle='#f0e4d6';p.fillRect(rx,y,mw,mh);p.strokeStyle=INK;p.lineWidth=3;p.strokeRect(rx,y,mw,mh);
 const dec=C.decor(),n=Math.min(260,(S.postIdx||S.land.count)),sxm=mw/W,sym=mh/(H-540);
 p.strokeStyle='#d9c3ad';p.lineWidth=2;for(const w of dec.washes){p.beginPath();w.forEach((q,i)=>{const mx=rx+q[0]*sxm,my=y+(q[1]-HOR)*(mh/(H-HOR));i?p.lineTo(mx,my):p.moveTo(mx,my)});p.stroke()}
 for(let i=0;i<n;i++){const d=dec.land[i];if(!d)break;const mx=rx+d.x*sxm,my=y+(d.y-540)*sym;p.fillStyle=i===n-1?'#c4452f':'#4e8a68';p.beginPath();p.arc(mx,my,i===n-1?7:3.2,0,7);p.fill()}
 const me=dec.land[n-1];if(me){const mx=rx+me.x*sxm,my=y+(me.y-540)*sym;p.strokeStyle='#c4452f';p.lineWidth=3;p.beginPath();p.arc(mx,my,15,0,7);p.stroke();p.fillStyle='#c4452f';p.font=`500 22px ${mono}`;p.fillText('← '+(S.lang==='zh'?'你':S.lang==='es'?'tú':'you'),mx+22,my+7)}
 y+=mh+54;p.fillStyle='#8a8fb0';p.font=`400 22px ${mono}`;p.fillText('Mirage Bloom · Hallucination',rx,Math.min(y,PH-62));
 pc.toBlob(b=>{if(b){if(S.postcard&&S.postcard.url&&S.postcard.url.startsWith('blob:'))URL.revokeObjectURL(S.postcard.url)}},'image/png');
 S.postcard={url:pc.toDataURL('image/png')};
}

/* ---------- rendering ---------- */
function render(){
 const P=S.cur,d=C.decor();
 g.setTransform(scale,0,0,scale,0,0);g.clearRect(0,0,W,H);
 let env=0,tilt=0;
 if(S.shift){const p=clamp((S.at-S.shift.t0)/S.shift.dur,0,1);env=Math.sin(Math.PI*p)}
 const mot=!S.reduce;
 const sh=f=>(S.shift&&mot)?env*f*110*(Math.sin(S.at*.7)*.5+.8):0;
 if(S.shift&&mot){tilt=env*.035;g.save();g.translate((Math.random()-.5)*8*env,(Math.random()-.5)*8*env)}
 C.drawSky(g,P);C.drawClouds(g,P);C.drawMesas(g,P,sh(.3));
 if(S.stage===5||(S.stage===6&&false))C.drawSurreal(g,P,ease(clamp((S.at-S.stageT)/3,0,1)),sh(.6));
 C.drawGround(g,P,sh(1),tilt);
 if(S.flood>.02)C.drawFlood(g,S.flood);
 C.drawTrees(g,P,sh(1));C.drawLandSaguaros(g,P,sh(1.2),P.L,P.shA);
 C.drawDome(g,P,sh(1));
 if(S.stage===4)C.drawRoad(g);
 C.drawPlayerSag(g,P,sh(1));
 if(S.stage===6)C.drawSprout(g,820,812);
 C.drawBobcat(g,1470,830,1.15);
 for(const b of S.bubbles){if(b.state==='live'||b.state==='fade')C.drawSource(g,b,P)}
 for(const b of S.bubbles)C.drawBubble(g,b);
 for(const q of S.parts){g.fillStyle=rgba(q.col.length===7?q.col:'#ffffff',clamp(1-q.life/q.max,0,1));g.beginPath();g.arc(q.x,q.y,q.r,0,7);g.fill()}
 C.drawMotes(g,P);
 if(S.shift){if(mot)g.restore();else{g.fillStyle=`rgba(255,248,235,${env*.35})`;g.fillRect(0,0,W,H)}}
}

/* ---------- loop ---------- */
let last=performance.now(),idleCls=false;
function frame(now){
 const dt=Math.min(.05,(now-last)/1000);last=now;
 S.at+=dt;const running=!S.paused&&!S.modal;if(running)S.t+=dt;
 S.idle+=dt;const idle=S.idle>8&&!S.modal;if(idle!==idleCls){idleCls=idle;$('#hud').classList.toggle('idle',idle)}
 if(S.palT<1){S.palT=Math.min(1,S.palT+dt/3.5);S.cur=lerpPal(S.palFrom,S.palTo,ease(S.palT))}
 if(S.stage===0)S.flood=1;else S.flood=Math.max(0,S.flood-dt/6);
 $('#hint').classList.toggle('faded',S.stage>=1&&S.stage<=5&&!S.paused&&(S.at-S.stageT)>14);
 // hover timers and listening
 for(const b of S.bubbles){
  if(b.state==='live'){
   const age=S.t-b.born;b.alpha=Math.min(1,b.alpha+dt*1.2);
   b.y=b.y0-age*2.2+(S.reduce?0:Math.sin(S.at*1.2+b.ph)*5);
   if(b===S.hover)b.hoverT+=dt;else b.hoverT=0;
   const want=b===S.kfocus||b===S.tfocus||(b===S.hover&&b.hoverT>.3);
   if(want&&!b.listening)startListen(b);else if(!want&&b.listening)stopListen(b);
   if(running&&age>b.life){b.state='fade';b.state0=S.at;stopListen(b);if(S.kfocus===b)S.kfocus=null;if(S.tfocus===b)S.tfocus=null;updateUI()}
  }else{
   const p=S.at-b.state0;
   if(b.state==='fade'){b.alpha=Math.max(0,1-p/1.5)}
   else if(b.state==='kept'){const k=ease(clamp(p/.9,0,1));const tg=S.sagPos?{x:S.sagPos.x,y:S.sagPos.top+40}:{x:232,y:760};b.x=lerp(b.fx,tg.x,k);b.y=lerp(b.fy,tg.y,k);b.alpha=1-k*.7;if(p>.9){burst(b.x,b.y,'#ffe3a8',10);b.alpha=0}}
   else if(b.state==='dissolve'){b.alpha=Math.max(0,1-p/.7);b.r=40+p*20}
   else if(b.state==='sink'){b.y+=dt*40;b.alpha=Math.max(0,1-p/1.2)}
   if(b.alpha<=0)b.state='gone';
  }
 }
 S.bubbles=S.bubbles.filter(b=>b.state!=='gone');
 for(const q of S.parts){q.life+=dt;q.x+=q.vx*dt;q.y+=q.vy*dt;q.vy+=60*dt}
 S.parts=S.parts.filter(q=>q.life<q.max);
 S.ghosts=S.ghosts.filter(x=>S.at-x.t<6);
 // spawn
 if(running&&S.stage>=1&&S.stage<=5&&!S.shift){
  const st=ST[S.stage],live=S.bubbles.filter(b=>b.state==='live').length;
  if(live<st.maxB&&(S.t-S.lastSpawn)>=st.gap*(S.spawnCount===0?.35:1)*(.85+((S.nid*37)%30)/100))spawn();
 }
 render();
 requestAnimationFrame(frame);
}

/* ---------- start ---------- */
resize();updateUI();requestAnimationFrame(frame);
window.MB={S,C,startStage,beginGame,keepBubble,dismissBubble,spawn,plant,openComplete,openJournal,renderEnd,resetRun,makePostcard,
 keepAllReal(){for(const b of S.bubbles.filter(x=>x.state==='live'&&x.real))keepBubble(b)},
 dismissAllMirage(){for(const b of S.bubbles.filter(x=>x.state==='live'&&!x.real))dismissBubble(b)},
 setLang(l){S.lang=l;updateUI()}};
})();
</script></body></html>
